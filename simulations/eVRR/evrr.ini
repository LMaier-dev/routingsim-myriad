[General]
include user.ini
network = routingsim.simulations.eVRR.DefaultNetwork

################################################################## DEFAULTS ###
[Config base]
# node
**.protocols = "routingsim.routing.evrr.VirtualRing"

# statistics
**.samplingInterval=1.0

# evrr default parameters
**.roundTime=1s						# round time
**.immediateResponse=true			# flag, whether a node directly responses
**.parallelDiscoveries=4			# number of parallel discovery messages
**.useLinearization=false			# flag, whether linearization is used
**.consistencyCheck=60rounds		# period of a consistency check
**.timeout=30rounds					# period until entries time out
**.useRouteDescentCriterion=false	# flag, whether routing should check descent
**.useAnycast=false					# usually do not use anycast
**.delayThreshold=5					# default delay threshold

# node delay
**.nodeMinDelay=50ms
**.nodeMaxDelay=350ms
		

# default simtime is 300 seconds!
sim-time-limit = 300s

################################################################################

[Config k20]
extends=base
**.topology=${topology=star,ba}
**.N=${N=256,512,1024,2048,4096,8192}
**.k=${k=20}
**.topologyFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.txt"
**.spathFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.spath"

[Config k20-small]
extends=base
**.topology=${topology=star,ba}
**.N=${N=256,512,1024,2048}
**.k=${k=20}
**.topologyFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.txt"
**.spathFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.spath"

[Config n2048]
extends=base
**.topology=${topology=star,ba}
**.N=${N=2048}
**.k=${k=10,20,30}
**.topologyFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.txt"
**.spathFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.spath"

[Config k20-n2048]
extends=base
**.topology=${topology=star,ba}
**.N=${N=2048}
**.k=${k=20}
**.topologyFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.txt"
**.spathFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.spath"

################################################################################

[Config k20-convergence]
extends=k20
sim-time-limit=60s
**.dynamicsModel=${Churn="None"}
**.useAnycast=${useAnycast=true,false}
**.immediateResponse=${immediateResponse=true,false}
**.useLinearization=${useLinearization=false,true}
**.delayThreshold=${delayThreshold=5}

[Config n2048-convergence]
extends=n2048
sim-time-limit=100s
**.dynamicsModel=${Churn="None"}
**.useAnycast=${useAnycast=true,false}
**.immediateResponse=${immediateResponse=true,false}
**.useLinearization=${useLinearization=false,true}

[Config k20-n2048-discovery]
extends=k20-n2048
sim-time-limit=60s
**.dynamicsModel=${Churn="None"}
**.immediateResponse=${immediateResponse=false}
**.parallelDiscoveries=${parDisc=1,2,3,4,5,6,7,8}
**.useLinearization=${useLinearization=false}
**.useAnycast=${useAnycast=false}

#######################################

[Config k20-n2048-delay-thres]
extends=k20-n2048
sim-time-limit=200s
**.dynamicsModel=${Churn="None"}
**.parallelDiscoveries=${parDisc=1,2,3,4,6,7,8}
**.useLinearization=${useLinearization=false}
**.useAnycast=${useAnycast=false}
**.immediateResponse=${immediateResponse=true,false}
**.delayThreshold=${delayThreshold=2,3,4,5}


#######################################

[Config k20-lt-churn]
extends=k20-small
sim-time-limit=200s
**.dynamicsModel=${Churn="LifetimeChurn"}
**.useLinearization=${useLinearization=false,true}
**.useAnycast=${useAnycast=true,false}
**.meanLifetime=${Lifetime=1000,5000,10000,20000}s

[Config k20-n2048-lt-churn]
extends=k20-n2048
sim-time-limit=200s
**.dynamicsModel=${Churn="LifetimeChurn"}
**.useLinearization=${useLinearization=false}
**.useAnycast=${useAnycast=true,false}
**.immediateResponse=${immediateResponse=true,false}
**.meanLifetime=${Lifetime=1000,5000,10000,20000}s

#######################################

[Config k20-cf-churn]
extends=k20
sim-time-limit=300s
**.dynamicsModel=${Churn="CatastrophicFailure"}
**.useLinearization=${useLinearization=false,true}
**.useAnycast=${useAnycast=true,false}
**.fraction=${F=0.05,0.10,0.20,0.40} 

[Config k20-n2048-cf-churn]
extends=k20-n2048
sim-time-limit=300s
**.dynamicsModel=${Churn="CatastrophicFailure"}
**.useLinearization=${useLinearization=false,true}
**.useAnycast=${useAnycast=true,false}
**.fraction=${F=0.05,0.10,0.20,0.40} 
**.immediateResponse=${immediateResponse=true,false}

#######################################

[Config k20-n2048-cf-discovery]
extends=k20-n2048
sim-time-limit=300s
**.dynamicsModel=${Churn="CatastrophicFailure"}
**.parallelDiscoveries=${parDisc=1,4,8}
**.useLinearization=${useLinearization=false}
**.useAnycast=${useAnycast=false}
**.immediateResponse=${immediateResponse=true,false}
**.fraction=${F=0.10}

#######################################
## TESTS
#######################################

[Config k20-cf-churn-small]
extends=k20
repeat=1
sim-time-limit=30s
**.parallelDiscoveries=${P=4}
**.useAnycast=${useAnycast=false}
**.dynamicsModel=${Churn="CatastrophicFailure"}
**.useLinearization=${useLinearization=false,true}
**.fraction=${F=0.10} 

[Config k20-convergence-fast]
extends=base
sim-time-limit=30s
**.topology=${topology=ba}
**.N=${N=2048}
**.k=${k=20}
**.topologyFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.txt"
**.spathFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.spath"
**.dynamicsModel=${Churn="None"}
**.useAnycast=${useAnycast=true}
**.immediateResponse=${immediateResponse=true}
**.useLinearization=${useLinearization=false}

[Config mem-test]
extends=base
sim-time-limit=30s
**.topology=${topology=ba}
**.N=${N=256,512,1024,2048}
**.k=${k=20}
**.topologyFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.txt"
**.spathFile="${topo}/cd-${topology}-rnd-n${N}-k${k}-seed${repetition}.spath"
**.dynamicsModel=${Churn="None"}
**.useAnycast=${useAnycast=false}
**.immediateResponse=${immediateResponse=true}
**.useLinearization=${useLinearization=false}
