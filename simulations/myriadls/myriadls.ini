[General]
ned-path=../../src;..
**.protocols = "routingsim.routing.myriadls.myriadls"
network = routingsim.simulations.DefaultNetwork
sim-time-limit = 10s
**.nodeMinDelay = 0us
**.nodeMaxDelay = 0us

# parameters
**.helloInterval = 2s
**.deadInterval = 4s
**.rxmtInterval = 1s

[Config PaperTopology]
*.manager.topologyFile = "topologies/myriad_paperexample.txt"
*.mainStatistics.samplingInterval = 0.01s
# Disable express mode to allow the use of EV << in the protocol code.
cmdenv-express-mode = false
# Debugging and logging settings
**.logLevel="debug"
**.colorLog=true
# Disable event banners to reduce clutter in the output.
cmdenv-event-banners = false

*.dynamics.fraction = 0
*.dynamics.warmup = 0s
**.mobility = false
**.numNodes = 5