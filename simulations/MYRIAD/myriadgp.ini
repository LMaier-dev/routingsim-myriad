[General]
ned-path=../../src;..
**.protocols = "routingsim.routing.MYRIAD.myriadgp"
network = routingsim.simulations.DefaultNetwork
sim-time-limit = 30s
**.nodeMinDelay = 0us
**.nodeMaxDelay = 0us

# parameters
**.helloInterval = 2s
**.deadInterval = 4s
**.rxmtInterval = 1s
**.dbExchangeBatchSize = 10
# short so a run observes several king-refresh cycles
**.refreshInterval = 3s
**.refreshJitter = 1s

[Config PaperTopology]
*.manager.topologyFile = "topologies/myriad_paperexample.txt"
*.mainStatistics.samplingInterval = 0.01s
# Disable express mode to allow the use of EV << in the protocol code.
cmdenv-express-mode = false
# Debugging and logging settings
**.logLevel="debug"
**.colorLog=true
# Disable event banners to reduce clutter in the output.
cmdenv-event-banners = false

*.dynamics.fraction = 0
*.dynamics.warmup = 0s
**.mobility = false
**.numNodes = 5

# Ring A: {0,1,3}  Ring B: {1,2,3,4,6}  Ring C: {2,5,6}
**.Node0.*.ringLabel = "A"
**.Node1.*.ringLabel = "A,B"
**.Node2.*.ringLabel = "B,C"
**.Node3.*.ringLabel = "A,B"
**.Node4.*.ringLabel = "B"
**.Node5.*.ringLabel = "C"
**.Node6.*.ringLabel = "B,C"

[Config TwoNodeRing]
# Two 3-node rings (A, C) joined by a 2-node ring (B) = a single link.
# Exercises the echo path that closes a degenerate ring's circular ACK.
*.manager.topologyFile = "topologies/myriad_twonode_ring.txt"
*.mainStatistics.samplingInterval = 0.01s
cmdenv-express-mode = false
**.logLevel="debug"
**.colorLog=true
cmdenv-event-banners = false

*.dynamics.fraction = 0
*.dynamics.warmup = 0s
**.mobility = false

# Per-node ring membership (overrides the built-in id table).
**.Node0.*.ringLabel = "A"
**.Node1.*.ringLabel = "A"
**.Node2.*.ringLabel = "A,B"
**.Node3.*.ringLabel = "B,C"
**.Node4.*.ringLabel = "C"
**.Node5.*.ringLabel = "C"