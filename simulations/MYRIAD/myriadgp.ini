[General]
ned-path=../../src;..
**.protocols = "routingsim.routing.MYRIAD.myriadgp"
network = routingsim.simulations.DefaultNetwork

include eval_common.ini

[Config PaperTopology]
*.manager.topologyFile = "topologies/myriad_paperexample.txt"
*.mainStatistics.samplingInterval = 0.01s
# express off so EV << logging in the protocol shows.
cmdenv-express-mode = false
**.logLevel="info"
**.colorLog=true
cmdenv-event-banners = false

**.Node0.*.ringLabel = "1000000"
**.Node1.*.ringLabel = "1000000,999999"
**.Node2.*.ringLabel = "999999,999998"
**.Node3.*.ringLabel = "1000000,999999"
**.Node4.*.ringLabel = "999999"
**.Node5.*.ringLabel = "999998"
**.Node6.*.ringLabel = "999999,999998"

[Config LargeTopology]
*.manager.topologyFile = "topologies/myriad_large.txt"
*.mainStatistics.samplingInterval = 0.01s
cmdenv-express-mode = false
**.logLevel="info"
**.colorLog=true
cmdenv-event-banners = false

include myriad_large.ringlabels.ini

[Config Grid10]
# 81-ring scalability benchmark. python3 topo2rings.py ../topologies/grid_10,10.txt
*.manager.topologyFile = "topologies/grid_10,10.txt"
*.mainStatistics.samplingInterval = 0.01s
cmdenv-express-mode = false
**.logLevel="info"
**.colorLog=true
cmdenv-event-banners = false

*.dynamics.fraction = 0
*.dynamics.warmup = 0s
**.mobility = false

**.refreshInterval = 15s
**.refreshJitter = 0s

include grid_10,10.min.ringlabels.ini

[Config TwoNodeRing]
# Two 3-node rings (A, C) joined by a 2-node ring (B) = a single link.
# Exercises the echo path that closes a degenerate ring's circular ACK.
*.manager.topologyFile = "topologies/myriad_twonode_ring.txt"
*.mainStatistics.samplingInterval = 0.01s
cmdenv-express-mode = false
**.logLevel="debug"
**.colorLog=true
cmdenv-event-banners = false

**.Node0.*.ringLabel = "1000000"
**.Node1.*.ringLabel = "1000000"
**.Node2.*.ringLabel = "1000000,999999"
**.Node3.*.ringLabel = "999999,999998"
**.Node4.*.ringLabel = "999998"
**.Node5.*.ringLabel = "999998"
