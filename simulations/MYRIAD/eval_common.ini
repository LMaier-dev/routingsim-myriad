# Shared timing/knobs for ALL MyriadGP/LS eval runs — the single source of truth
# for the comparison conditions. eval_scaling.py includes it per run and copies
# it into eval/plots/ for reproducibility; test_rib_batching.py loads it first.
# Per-run knobs (topology, ring labels, holdInterval sweep) live in the scripts;
# test_rib_batching.py overrides sim-time-limit and refreshInterval on the CLI to
# force full convergence before the RIB snapshot.
[General]
sim-time-limit = 50s

# Timing aligned for BOTH protocols to keep the comparison fair: jitter off (LS's
# DBD exchange wedges under hello jitter), non-zero control-plane delay (GP
# livelocks at zero).
**.helloInterval = 1s
**.deadInterval = 4s
**.rxmtInterval = 1s
**.helloJitter = 0s
**.nodeMinControlPlaneDelay = 10000ns   # 0.01 ms /1km fibre
**.nodeMaxControlPlaneDelay = 250000ns   # 0.5 ms /50km fibre

**.dbExchangeBatchSize = 10
**.refreshInterval = 100s
**.refreshJitter = 1s

# GP knobs pinned explicitly (see MyriadGp.ned) so a results bundle records the
# exact conditions regardless of later .ned default changes.
**.ringCostExponent = 2
**.maxEcmpPaths = 3
**.maxBatchBytes = 4096
**.holdInterval = 100ms        # 0s = off; --no-batch forces this

cmdenv-express-mode = true
**.logLevel = "warn"
cmdenv-event-banners = false
