# eval_common.ini — canonical fair-timing knobs shared by ALL MyriadGP/LS
# evaluation runs. eval_scaling.py `include`s this at the top of every generated
# per-run ini; test_rib_batching.py loads it as the first positional ini. Single
# source of truth for the comparison conditions, so results are reproducible and
# the knobs live in ONE place instead of duplicated across python scripts.
#
# A copy is dropped into eval/plots/ on each run so a results bundle carries the
# exact conditions that produced it.
#
# Per-run knobs are NOT here — the scripts own them: topology + ring labels, the
# swept holdInterval, and any deviations. test_rib_batching.py overrides
# sim-time-limit=120s and refreshInterval=200s on the command line (command line
# beats ini) so both protocols fully converge before the RIB snapshot.
[General]
sim-time-limit = 50s

# Aligned timing for BOTH protocols (see the GP-vs-LS analysis): identical
# hello/dead/rxmt, jitter OFF (LS's DBD exchange wedges under hello jitter), a
# uniform 1 ms control-plane delay (GP livelocks at zero), enough runtime to
# converge.
**.helloInterval = 1s
**.deadInterval = 4s
**.rxmtInterval = 1s
**.helloJitter = 0s
# between 1 and 2 ms of control-plane delay per node
**.nodeMinControlPlaneDelay = 1000000ns
**.nodeMaxControlPlaneDelay = 2000000ns

# LS DB-exchange batch size + king re-collect cadence.
**.dbExchangeBatchSize = 10
**.refreshInterval = 100s
**.refreshJitter = 1s

# MyriadGP path-selection + batching knobs. Pinned explicitly (even at their NED
# defaults) so a results bundle records the exact conditions and survives any
# later change to the .ned defaults. holdInterval is the configured batch window;
# pass --no-batch to eval_scaling.py to override it to 0s (batching off).
**.ringCostExponent = 2        # cost = Σ member_count^2 over the chain
**.maxEcmpPaths = 3            # co-best (equal spof/cost/len) chains kept per origin
**.maxBatchBytes = 4096        # max serialized batch size ≈ e.g. one BGP UPDATE batches up to 4096 bytes
**.holdInterval = 100ms        # inter-ring batch window (0s = off; --no-batch forces this)

cmdenv-express-mode = true
**.logLevel = "warn"
cmdenv-event-banners = false
