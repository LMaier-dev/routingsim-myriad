# Single source of truth for all MyriadPV/LS eval run conditions.
# Scripts deviate only via eval_harness.overrides(), which prints the deviation.
# Global tuning: --refresh, --warmup, --snapshot, --set KEY=VALUE.
sim-time-limit = 100s

# Fair for BOTH protocols: no hello jitter (LS's DBD wedges under it), non-zero
# control-plane delay (PV livelocks at zero).
**.helloInterval = 4s
**.deadInterval = 9s
**.rxmtInterval = 2s
**.helloJitter = 2s
**.nodeMinControlPlaneDelay = 10000ns   # 0.01 ms /1km fibre
**.nodeMaxControlPlaneDelay = 250000ns   # 0.5 ms /50km fibre

# PV batches up to 4096 bytes, so let the LSDB exchange batch too.
**.dbExchangeBatchSize = 220

# THE refresh interval; change it with --refresh. refreshJitter is derived as 10% of this.
**.refreshInterval = 120s
**.updateJitter = 10s
# Node-wave settle time: seconds from one failure fraction to the next. 
# Also becomes the node scenario's refreshInterval (eval_dynamics.node_refresh).
**.waveSpacing = 50s
**.collectWarmupDuration = 30s
# Ring ids <= this are two-node echo rings; see myriad_topologies/topo2rings.py ECHO_ID_BASE.
**.echoRingIdMax = 900000

# Policy
**.maxEcmpPaths = 3
**.ecmpCostMargin = 0.25
**.ringCostExponent = 2
**.rankUseSpof = true
**.echoRingSize = 20
# Total chains per origin ring, not extra ones: 1 is single-path. 2 = one backup.

# Message Count or Volume optimizations
**.spofHoldMultiplier = 3.0
**.holdCostScaled = true
**.suppressRedundantTransitions = true
**.holdInterval = 50ms
**.maxBatchBytes = 4096
# Disabled for eval
**.skipDegradedTransitions = false

# Resolution of every latency an eval reports. Free without a dump file.
**.snapshotInterval = 1000ms

# Static by default; scenarios enable churn via eval_harness.dynamics_args().
**.mobility = false
**.dynamics.linkSelection = "none"
**.dynamics.fraction = 0
**.dynamics.warmup = 0s

cmdenv-express-mode = true
**.logLevel = "warn"
cmdenv-event-banners = false
