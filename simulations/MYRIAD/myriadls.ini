[General]
ned-path=../../src;..
**.protocols = "routingsim.routing.MYRIAD.myriadls"
network = routingsim.simulations.DefaultNetwork

include eval_common.ini

[Config PaperTopology]
*.manager.topologyFile = "MYRIAD/myriad_paperexample.txt"
*.mainStatistics.samplingInterval = 0.01s
# Disable express mode to allow the use of EV << in the protocol code.
cmdenv-express-mode = false
# Debugging and logging settings
**.logLevel="info"
**.colorLog=true
# Disable event banners to reduce clutter in the output.
cmdenv-event-banners = false

# parameters
**.dbExchangeBatchSize = 200 # overwritten by eval_common.ini

**.Node0.*.ringLabel = "1000000"
**.Node1.*.ringLabel = "1000000,999999"
**.Node2.*.ringLabel = "999999,999998"
**.Node3.*.ringLabel = "1000000,999999"
**.Node4.*.ringLabel = "999999"
**.Node5.*.ringLabel = "999998"
**.Node6.*.ringLabel = "999999,999998"

[Config LargeTopology]
*.manager.topologyFile = "MYRIAD/myriad_large.txt"
*.mainStatistics.samplingInterval = 0.01s
cmdenv-express-mode = false
**.logLevel="info"
**.colorLog=true
cmdenv-event-banners = false

*.dynamics.fraction = 0
*.dynamics.warmup = 0s
**.mobility = false

include myriad_large.ringlabels.ini

[Config Grid10]
# python3 topo2rings.py ../topologies/grid_10,10.txt
# Scalability benchmark: express mode on + logLevel warn so the 81-ring grid
# runs quiet (info-level EV on this many rings explodes the log to ~GB).
*.manager.topologyFile = "topologies/grid_10,10.txt"
*.mainStatistics.samplingInterval = 0.01s
cmdenv-express-mode = true
**.logLevel="warn"
**.colorLog=true
cmdenv-event-banners = false

*.dynamics.fraction = 0
*.dynamics.warmup = 0s
**.mobility = false

include grid_10,10.min.ringlabels.ini