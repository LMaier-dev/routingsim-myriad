## Note: first matching occurrence is used; list specific settings first, and more general ones later.

[General]
ned-path = ../../src;..
network = routingsim.simulations.DefaultNetwork
**.protocols = "routingsim.routing.r2kademlia.R2Kademlia"

**.nodeMinDelay = 0us
**.nodeMaxDelay = 500us

**.bucketSize = 40

*.mainStatistics.samplingInterval = 1s
*.dynamics.fraction = 0
# statistics (e.g., delivery vector) is recorded after warmup time
*.dynamics.warmup = 0s
# the recordShortestPathDeliveryRatio is computationally costly
*.mainStatistics.recordShortestPathDeliveryRatio = false
# how many samples of delivered messages should be recorded
**.messageDeliverySample = 10000
# how many samples of dropped messages should be recorded
**.messageDroppedSample = 10000
# message sample time: start recording delivered/dropped messages after this time
**.messageSampleTime = 30s
# detailedRoutingTableStats (default is true)
**.detailedRoutingTableStats = true

# how many nodes or routing table details should be recorded
**.nodeSample = 10000
**.routingTableSample = 1000

# send probe (random IDs) and reachability test (whether existing nodes can be reached) every probeInterval
# Note that this will cause a send rate of roughly 4/probeInterval
# (expect two answers for incoming probe/reachability requests)
**.probeInterval = 0.4s # 10 messages per second send by each node

**.sendDataPackets = false
**.usePathIDs = false

sim-time-limit = 60s

**.cmdenv-log-level = trace

[Config FloodStudy]
**._n = ${n = 100}
**.sendDataPackets = false
**.usePathIDs = true
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n100_m3_p0.5_seed${seed}.txt"
**.floodStrideFactor = ${s = 0, 6}
**.floodCompleteBucketOpt = ${opt = true, false}
sim-time-limit = 20s
**.floodInterval = 10s
**.Node800.*.floodInterval = 10s

[Config FloodStudySize]
**._n = ${n = 500, 1000, 5000, 10000, 20000, 50000}
**.sendDataPackets = false
**.usePathIDs = true
**._seed = ${seed = 0}
**.floodStrideFactor = ${s = 0, 6}
**.floodCompleteBucketOpt = ${opt = true, false}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m3_p0.5_seed${seed}.txt"
**.Node99.*.floodInterval = 10s
sim-time-limit = 20s

[Config FloodStudyFailure]
**.sendDataPackets = false
**.usePathIDs = true
**._seed = ${seed = 0}
**.floodStrideFactor = ${s = 0, 6}
**._n = ${n = 100, 200, 500, 1000, 5000, 10000, 20000, 50000}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m3_p0.5_seed${seed}.txt"
routingsim.NetworkManager.dynamicsModel = "LinkFailure"
**.linkFailure = true
**.linkFraction = 0.0
**.linkSelection = "random"
**.oneFailure = true
**.numLinksFail = ${fl = 1, 2, 5, 10, 20}
**.failureFocussedProbing = false
**.floodOnFailure = true
**.dynamics.**.nodeFailure = 0
**.dynamics.**.warmup = 20s
**.dynamics.period = 20s
**.dynamics.duration = 30s
sim-time-limit = 30s
constraint = $s == 6 
#constraint = $s == 6 && ($n == 10000 || $fl == 1) 
repeat = 5

[Config FloodStudyStride]
**._n = ${n = 10000}
**.floodStrideFactor = ${s = 0 .. 8}
**.sendDataPackets = false
**.usePathIDs = true
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m3_p0.5_seed${seed}.txt"
sim-time-limit = 20s
**.floodInterval = 10s
**.Node800.*.floodInterval = 10s

[Config FloodStudyRandom]
extends = FloodStudy 
*.manager.topologyFile = "topologies/gnd_n${n}_d8.txt"

[Config FloodStudyWS]
extends = FloodStudy 
*.manager.topologyFile = "topologies/watts_strogatz_graph_n${n}_k6_p0.01_seed${seed}.txt"
**.hopLimit = 800

[Config FloodStudyRandomGeometric]
extends = FloodStudy 
*.manager.topologyFile =  "topologies/random_geometric_n10000_r0.016075_seed0.txt"
**.hopLimit = 800

[Config FloodStudyGrid]
extends = FloodStudy 
*.manager.topologyFile = "topologies/grid_100,100.txt"
**.hopLimit = 800
