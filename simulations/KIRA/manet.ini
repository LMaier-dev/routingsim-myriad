[General]
ned-path = ../../src;..
network = routingsim.simulations.DefaultNetwork
**.protocols = "routingsim.routing.KIRA.R2Kademlia"

**.nodeMinDelay = 0us
**.nodeMaxDelay = 250us

*.mainStatistics.samplingInterval = 0.5s
*.dynamics.fraction = 0
*.dynamics.warmup = 0s
# statistics (e.g., delivery vector) is recorded after warmup time
warmup-period = 10s
#*.manager.shortestPathCalculationMode="onDemandBidirectionalBFS" # fullDistanceMatrix, onDemand, onDemandBidirectionalBFS
# the recordShortestPathDeliveryRatio is computationally costly
*.mainStatistics.recordShortestPathDeliveryRatio = false
# how many samples of delivered messages should be recorded
**.messageDeliverySample = 10000
# how many samples of dropped messages should be recorded
**.messageDroppedSample = 10000
# message sample time: start recording delivered/dropped messages after this time
**.messageSampleTime = 90s
# detailedRoutingTableStats (default is true), provides routingTablePathLength, routingTablePathStretch
**.detailedRoutingTableStats = true

# how many nodes or routing table details should be recorded
**.nodeSample = 10000
**.routingTableSample = 10000

# send probe (random IDs) and reachability test (whether existing nodes can be reached) every probeInterval
# Note that this will cause a send rate of roughly 4/probeInterval
# (expect two answers for incoming probe/reachability requests)
**.probeInterval = 0.4s # 10 messages per second send by each node

**.cmdenv-log-level = detail

sim-time-limit = 1000s

**.mobility = true
**.sendDataPackets = true
**.usePathIDs = true
*.manager.topologyFile = ""
**.topologyStatistics = "Light"
*.manager.shortestPathCalculationMode="onDemandBidirectionalBFS"

**._n = 0
**._m = 3
num-rngs = 2
# mobilitySeed = seed-1-mt; networkSeed = seed-0-mt
seed-0-mt = ${mobilitySeed = 0..4}
seed-1-mt = ${mobilitySeed}

# Mobility parameters
**.mobilityNodes = ${mN = 200, 500, 1000, 2500}
**.maxReachablityTries = ${mrt = 228, 21, 10, 10 ! mN}
**.borderX = ${borderX = 5000m, 10000m}
**.borderY = ${borderY = 5000m, 2500m ! borderX}
**.useGrid = false
**.updateInterval = 0.1s

# Antenna parameters
#**.minSignalPower = -1.9892db # 250m
#**.maxSignalPower = -1.9892db # 250m
**.minSignalPower = -9.9480db # 100m
**.maxSignalPower = -9.9480db # 100m
**.minSendGain = 0db
**.maxSendGain = 0db
**.minRecvGain = 0db
**.maxRecvGain = 0db
**.minFreq = 2400MHz
**.maxFreq = 2400MHz
**.bandwidth = 40MHz
**.systemNoise = -172db

# Random-Waypoint parameters
**.mobilityModel = "RandomWaypoint"
**.waitTime = 10s
**.minSpeed = 2mps
**.maxSpeed = 10mps

**.useLinkLayerIndication = false

# Optimized parameter values
**.bucketSize = 40
**.minHelloInterval = 100ms
**.maxHelloInterval = 1s

################### MANET Scenario ###################
[Config kParameterStudie]
**.bucketSize = ${k = 5, 10, 20, 30, 40}

[Config kParameterStudieShort]
extends = kParameterStudie
**.detailedKIRAMessageStats = true
sim-time-limit = 300s

[Config helloIntervalStudie]
**.bucketSize = ${k = 10, 20}
**.minHelloInterval = ${minHello= 50ms ,100ms, 200ms, 500ms}
**.maxHelloInterval = ${maxHello= 500ms, 1s, 2s, 5s !minHello}

[Config helloIntervalStudieShort]
extends = helloIntervalStudie
**.detailedKIRAMessageStats = true
sim-time-limit = 300s

[Config helloIntervalReferenceStudie]
# Reference Study for hello intervall using link layer notifications
**.useLinkLayerIndication = true

[Config helloIntervalReferenceStudieShort]
extends = helloIntervalReferenceStudie
**.bucketSize = ${k = 10, 20}
sim-time-limit = 300s

[Config linkFailureNotificationStudie]
**.linkFailureNotifications = ${lfn = 0, 1, 2, 3}

[Config linkFailureNotificationStudieShort]
extends = linkFailureNotificationStudie
sim-time-limit = 300s

[Config rediscoveryWaitTimeStudie]
**.PNRediscoveryWaitTime = ${pnWait = 50ms, 100ms, 200ms, 1s, 5s}
**.urgentRediscoveryWaitTime = ${urgentWait = 100ms, 200ms, 300ms, 1.5s, 8s ! pnWait}
**.regularRediscoveryWaitTime = ${regularWait = 500ms, 1s, 1.5s, 2s, 10s ! pnWait}
**.slowRediscoveryWaitTime = ${slowWait = 1s, 2s, 2.5s, 3s, 15s ! pnWait}
**.detailedKIRAMessageStats = true

[Config rediscoveryWaitTimeStudieShort]
extends = rediscoveryWaitTimeStudie
sim-time-limit = 300s

[Config discoveryRadiusStudie]
**.PNRediscoveryWaitTime = 50ms
**.urgentRediscoveryWaitTime = 100ms
**.regularRediscoveryWaitTime = 500ms
**.slowRediscoveryWaitTime = 1s
**.discoveryRadius = ${radius = 2, 3}

[Config discoveryRadiusStudieShort]
extends = discoveryRadiusStudie
sim-time-limit = 300s

[Config ManetDensityScenario]
constraint = ($mN) == 200 && ($borderX) == 5000m # Lock iter vars from [General] in place as we overwrite them with our own versions
**.mobilityNodes = ${mN2 = 200, 500, 1000, 2500}
**.maxReachabilityTries = ${10, 10, 228, 228, 919, 919 ! borderX2}
**.borderX = ${borderX2 = 2500m, 5000m, 5000m, 10000m, 10000m, 20000m}
**.borderY = ${borderY2 = 2500m, 1250m, 5000m,  2500m, 10000m,  5000m! borderX2}

[Config ManetDensityScenarioShort]
extends = ManetDensityScenario
sim-time-limit = 300s

[Config ManetDensityHeavyScenario]
extends = ManetDensityScenario
**.samplingInterval = 2s
**.topologyStatistics = "Heavy"

[Config ManetDensityHeavyScenarioShort]
extends = ManetDensityHeavyScenario
sim-time-limit = 300s

[Config ManetSpeedScenario]
**.minSpeed = ${minSpeed = 2mps, 2mps, 20mps}
**.maxSpeed = ${maxSpeed = 20mps, 3mps, 28mps ! minSpeed}

[Config ManetSpeedScenarioShort]
extends = ManetSpeedScenario
sim-time-limit = 300s

[Config ManetSpeedHeavyScenarioShort]
extends = ManetSpeedScenarioShort
**.samplingInterval = 2s
**.topologyStatistics = "Heavy"

[Config ManetWaitTimeScenario]
**.waitTime = ${waitTime = 1s, 5s, 10s, 20s}

[Config ManetWaitTimeScenarioShort]
extends = ManetWaitTimeScenario
sim-time-limit = 300s

[Config maxReachabilityTriesTest]
sim-time-limit = 300s
**.maxReachabilityTries = ${reachabilityTries = 10, 115, 500}

[Config gaussMarkovTest]
**.mobilityNodes = 10
**.borderX = 1000m
**.borderY = 1000m

# Gauss-Markov parameters
**.mobilityModel = "GaussMarkov"
**.beta = 7
**.speedMean = 6mps
**.speedVariance = 4mps
**.headingMean = 0
**.headingVariance = 30
**.borderMarginX = 100m
**.borderMarginY = 100m

[Config randomWaypointTest]
**.mobilityNodes = 10
**.borderX = 1000m
**.borderY = 1000m

# Random-Waypoint parameters
**.mobilityModel = "RandomWaypoint"
**.waitTime = 10s
**.minSpeed = 2mps
**.maxSpeed = 10mps
