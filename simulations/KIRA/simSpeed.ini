### Note: first matching occurrence is used; list specific settings first, and more general ones later.

[General]
ned-path = ../../src;..
network = routingsim.simulations.DefaultNetwork
**.protocols = "routingsim.routing.KIRA.R2Kademlia"

**.mobility = false
**.nodeMinDelay = 0us
**.nodeMaxDelay = 500us
**.limitBandwidthLinks = false
**.bandwidthLinksBps = 1e9

**.bucketSize = 40

*.mainStatistics.samplingInterval = 1s
*.dynamics.fraction = 0
*.dynamics.warmup = 0s
# statistics (e.g., delivery vector) is recorded after warmup time
warmup-period = 10s
#*.manager.shortestPathCalculationMode="onDemandBidirectionalBFS" # fullDistanceMatrix, onDemand, onDemandBidirectionalBFS
# the recordShortestPathDeliveryRatio is computationally costly
*.mainStatistics.recordShortestPathDeliveryRatio = false
# how many samples of delivered messages should be recorded
**.messageDeliverySample = 10000
# how many samples of dropped messages should be recorded
**.messageDroppedSample = 10000
# message sample time: start recording delivered/dropped messages after this time
**.messageSampleTime = 30s
# detailedRoutingTableStats (default is true), provides routingTablePathLength, routingTablePathStretch
**.detailedRoutingTableStats = true

# how many nodes or routing table details should be recorded
**.nodeSample = 10000
**.routingTableSample = 10000


##**.linkFailureNotifications = 3
#	lfn_none = 0, // do not send linkFailureNotifications
#	lfn_floodonly= 1, // only flood LFNs to the direct neighbors
#	lfn_flood_and_directPID= 2, // flood LFNs to the direct neighbors and send to first segment sources directly via PID
#	lfn_full= 3 // flood LFNs to the direct neighbors and notify all first segments source, even via overlay



# send probe (random IDs) and reachability test (whether existing nodes can be reached) every probeInterval
# Note that this will cause a send rate of roughly 4/probeInterval
# (expect two answers for incoming probe/reachability requests)
**.probeInterval = 0.4s # 10 messages per second send by each node

**.sendDataPackets = false
**.usePathIDs = false

sim-time-limit = 60s

**.cmdenv-log-level = detail

################### MANET Scenario ###################
# Test simulation speed using RegularGrid for acceleration
[Config RegularGrid]
**._n = 0
**._m = 3
num-rngs = 2
**.sendDataPackets = true
**.usePathIDs = true
**.protocols = "routingsim.routing.KIRA.R2Kademlia"
sim-time-limit = 100s
*.manager.topologyFile = ""
**.topologyStatistics = "Light"
*.manager.shortestPathCalculationMode="onDemandBidirectionalBFS"
#*.manager.shortestPathCalculationMode="fullDistanceMatrix"
**.useLinkLayerIndication = false
**.minHelloInterval = 100ms
**.maxHelloInterval = 1s

# Mobility parameters
**.mobility = true
**.mobilityNodes = ${mN = 2500}
# mobilitySeed = seed-1-mt; networkSeed = seed-0-mt
seed-0-mt = 0
seed-1-mt = ${mSeed = 0}
**.borderX = 5000m
**.borderY = 5000m
**.useGrid = true
**.gridDepth = ${depth = 6,7,8}
**.useNearNodesCache = ${useCache = true, false}
**.useSparseGridCellUpdates = ${sparseUpdates = true, false}
**.updateInterval = 0.1s

# Antenna parameters
**.minSignalPower = 0db
**.maxSignalPower = 2db
**.minSendGain = 0db
**.maxSendGain = 0db
**.minRecvGain = 0db
**.maxRecvGain = 0db
**.minFreq = 2400MHz
**.maxFreq = 2400MHz
**.bandwidth = 40MHz
**.systemNoise = -172db

# Random-Waypoint parameters
**.mobilityModel = "RandomWaypoint"
**.waitTime = 10s
**.minSpeed = 1mps
**.maxSpeed = 10mps

