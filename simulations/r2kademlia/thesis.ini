[General]
ned-path = ../../src;..
network = routingsim.simulations.DefaultNetwork
**.protocols = "routingsim.routing.r2kademlia.R2Kademlia"

*.mainStatistics.samplingInterval = 2s
*.dynamics.fraction = 0
*.dynamics.warmup = 0s
*.mainStatistics.recordShortestPathDeliveryRatio = false
**.messageDeliverySample = 5000
**.messageDroppedSample = 1000
**.messageSampleTime = 1600s
**.nodeSample = 10000
**.routingTableSample = 1000

**.probeInterval = 1s

sim-time-limit = 2000s

[Config MyStudy]
**._n = ${n = 500, 1000, 5000, 10000}
**._m = ${m = 3}
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.txt"

################### Static Scenario ###################
[Config ProximityStudy]
extends = MyStudy
**.pathSnooping = ${snoop = true, false}
**.proximityRouting = ${pr = false, true}
**.proximityNeighborSelection = ${pns = false, true}
**.pathSimplification = ${simpl = false, true}

[Config ProbeStudy]
extends = MyStudy
**.probeStrategy = ${probe = 0, 1, 2, 3, 4}

[Config AcceleratedLookup]
extends = MyStudy
**.accelerationFactor = ${b = 1..8 step 1}

[Config SizeStudy]
**._n = ${n = 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000}
**._m = ${m = 1,2,3,4}
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.txt"

[Config RealworldStudy]
*.manager.topologyFile = ${"topologies/clos_fat_tree_30.txt", "topologies/powerlaw_cluster_graph_n1125_m15_p0.0_seed0.txt"}

################### Dynamic Scenario ###################
[Config LinkFailure]
extends = MyStudy
**.dynamicsModel=${Dynamics="MixedFailure"}
*.dynamics.linkFraction = ${lfr = 0.01..0.05 step 0.01} 
*.dynamics.nodeFailure = 0
*.dynamics.warmup = 100s

[Config CatastrophicFailure]
extends = MyStudy
**.dynamicsModel=${Dynamics="MixedFailure"}
*.dynamics.linkFraction = ${lfr = 0.05..0.2 step 0.05} 
*.dynamics.nodeFailure = 0
*.dynamics.warmup = 100s
**.dynamicsModel=${Dynamics="CatastrophicFailure"}





