[General]
ned-path = ../../src;..
network = routingsim.simulations.DefaultNetwork
**.protocols = "routingsim.routing.r2kademlia.R2Kademlia"

*.mainStatistics.samplingInterval = 2s
*.dynamics.fraction = 0
*.dynamics.warmup = 0s
*.mainStatistics.recordShortestPathDeliveryRatio = false
**.messageDeliverySample = 5000
**.messageDroppedSample = 1000
**.messageSampleTime = 1600s
**.nodeSample = 10000
**.routingTableSample = 1000

**.probeInterval = 1s

sim-time-limit = 2000s

[Config MyStudy]
**._n = ${n = 500, 1000, 5000, 10000}
**._m = ${m = 3}
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.txt"

################### Static Scenario ###################
[Config ProximityStudy]
extends = MyStudy
**.pathSnooping = ${snoop = true, false}
**.proximityRouting = ${pr = false, true}
**.proximityNeighborSelection = ${pns = false, true}
**.pathSimplification = ${simpl = false, true}
**.bucketSize = ${k = 20, 40}
**.findNodeNumber = 20
constraint = $k == 20 || ($simpl == true && $n==1000)

[Config ProbeStudy]
extends = MyStudy
**.probeStrategy = ${probe = 0, 1, 2, 3, 4, 5, 6}

[Config AcceleratedLookup]
extends = MyStudy
**.accelerationFactor = ${b = 1..8 step 1}

[Config SizeStudy]
**._n = ${n = 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000}
**._m = ${m = 1,2,3,4}
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.txt"

[Config RandomizeStudy]
extends = MyStudy
**.messageSampleTime = 500s
constraint = $n == 1000
sim-time-limit = 1000s
repeat = 30

[Config ClosFatTree]
*.manager.topologyFile = ${ topo = "topologies/clos_fat_tree_24_with_hosts.txt", "topologies/clos_fat_tree_30_with_hosts.txt", "topologies/clos_fat_tree_48_with_hosts.txt", "topologies/clos_fat_tree_24_without_hosts.txt", "topologies/clos_fat_tree_30_without_hosts.txt", "topologies/clos_fat_tree_48_without_hosts.txt",  "topologies/powerlaw_cluster_graph_n2880_m19_p0.5_seed0.txt", "topologies/powerlaw_cluster_graph_n7875_m2_p0.5_seed0.txt", "topologies/powerlaw_cluster_graph_n7875_m3_p0.5_seed0.txt", "topologies/powerlaw_cluster_graph_n4176_m2_p0.5_seed0.txt", "topologies/powerlaw_cluster_graph_n4176_m3_p0.5_seed0.txt", "topologies/clos_fat_tree_48_with_hosts.txt", "topologies/powerlaw_cluster_graph_n30528_m2_p0.5_seed0.txt", "topologies/powerlaw_cluster_graph_n30528_m3_p0.5_seed0.txt"}

[Config RealWorld]
*.manager.topologyFile = ${ topo = "topologies/KentuckyDataLink.graphml.txt", "topologies/powerlaw_cluster_graph_n754_m1_p0.5_seed0.txt", "topologies/powerlaw_cluster_graph_n754_m2_p0.5_seed0.txt", "topologies/ASEdges4_2016.txt", "topologies/powerlaw_cluster_graph_n26303_m1_p0.5_seed0.txt", "topologies/powerlaw_cluster_graph_n26303_m2_p0.5_seed0.txt"}

[Config WattsStro]
**._n = ${n = 1000, 5000, 10000}
**._k = ${k = 6}
**._seed = ${seed = 0}
**._p = ${p = 0.001, 0.003, 0.01, 0.03, 0.1, 0.2, 0.3, 1}
*.manager.topologyFile = "topologies/watts_strogatz_graph_n${n}_k${k}_p${p}_seed${seed}.txt"

[Config Grid]
**._n = ${n = 10, 30, 70, 100}
*.manager.topologyFile = "topologies/grid_${n},${n}.txt"
*.mainStatistics.recordShortestPathDeliveryRatio = true

[Config Grid-ProximityStudy]
**._n = ${n = 32}
*.manager.topologyFile = "topologies/grid_${n},${n}.txt"
*.mainStatistics.recordShortestPathDeliveryRatio = true
**.pathSnooping = ${snoop = true, false}
**.proximityRouting = ${pr = false, true}
**.proximityNeighborSelection = ${pns = false, true}
**.pathSimplification = true


################### Dynamic Scenario ###################
[Config LinkFailure]
extends = MyStudy
**.dynamicsModel=${Dynamics="MixedFailure"}
*.dynamics.linkFraction = ${lfr = 0.01..0.05 step 0.01} 
*.dynamics.nodeFailure = 0
*.dynamics.warmup = 100s

