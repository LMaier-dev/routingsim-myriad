**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.txt"
#**.discoveryRadius = 2
routingsim.NetworkManager.dynamicsModel = "LinkFailure"
**.fraction = 0.1
**.linkFailure = true
**.oneFailure = true
**.linkFraction = ${lfr = 0.1}
**.linkSelection = "randomAllButOne"
**.dynamics.**.nodeFailure = 0
**.dynamics.**.warmup = 1s
**.dynamics.period = 30s
**.dynamics.duration = 30s
#**.cmdenv-log-level = trace
sim-time-limit = 120s
**.sendDataPackets = true
**.usePathIDs = true
#repeat = 10

[Config LinkFailureTestSmall]
**._n = ${n = 100}
**._m = ${m = 3}
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.txt"
routingsim.NetworkManager.dynamicsModel = "LinkFailure"
**.fraction = 0.2
**.linkFailure = true
**.linkFraction = ${lfr = 0.35}
**.linkSelection = "random"
**.dynamics.**.nodeFailure = 0
**.dynamics.**.warmup = 1s
**.dynamics.period = 30s
**.dynamics.duration = 15s
#**.cmdenv-log-level = trace
sim-time-limit = 89s
#repeat = 10

[Config LinkFailureMixedCFTPLC]
*.manager.topologyFile = ${ topo = "topologies/MixedFatTreePowerLaw-n5376.txt", "topologies/MixedFatTreePowerLaw-n10400.txt" }
#*.mainStatistics.recordShortestPathDeliveryRatio = true
*.mainStatistics.samplingInterval = 0.1s
**.messageSampleTime = 0.1s
sim-time-limit = 60s
routingsim.NetworkManager.dynamicsModel = "LinkFailure"
**.fraction = 0.2
**.linkFailure = true
**.linkFraction = ${lfr = 0.05,0.1,0.15,0.2}
**.linkSelection = "random"
**.dynamics.**.nodeFailure = 0
**.dynamics.**.warmup = 1s
**.dynamics.period = 30s
**.dynamics.duration = 15s
**.oneFailure = true
**.failureFocussedProbing = false
repeat = 5
#**.probeInterval = 1s

