[Config ProximityStudy]
extends = MyStudy
**.pathSnooping = ${snoop = true, false}
**.proximityRouting = ${pr = false, true}
**.proximityNeighborSelection = ${pns = false, true}
**.pathSimplification = ${simpl = false, true}
**.bucketSize = ${k = 20, 40, 80}
**.findNodeNumber = 20
#constraint = $k == 20 || ($simpl == true && $n==1000)
constraint = ($k == 20 && $simpl == true && ($n==5000 || $n==10000)) && (($snoop==false && $pr==false && $pns==false) || ($snoop==true && $pr==true && $pns==true))

[Config ProbeStudy]
