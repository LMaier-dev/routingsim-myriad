## Note: first matching occurrence is used; list specific settings first, and more general ones later.

[General]
ned-path = ../../../src;../..
network = routingsim.simulations.DefaultNetwork
**.protocols = "routingsim.routing.r2kademlia.R2Kademlia"

**.nodeMinDelay = 0us
**.nodeMaxDelay = 500us

**.bucketSize = 40

*.mainStatistics.samplingInterval = 2s
*.dynamics.fraction = 0
# statistics (e.g., delivery vector) is recorded after warmup time
*.dynamics.warmup = 0s 
*.mainStatistics.recordShortestPathDeliveryRatio = false
# how many samples of delivered messages should be recorded
**.messageDeliverySample = 5000
# how many samples of dropped messages should be recorded
**.messageDroppedSample = 5000
# message sample time: start recording delivered/dropped messages after this time
**.messageSampleTime = 30s
# detailedRoutingTableStats (default is true)
**.detailedRoutingTableStats = true

# how many nodes or routing table details should be recorded
**.nodeSample = 10000
**.routingTableSample = 1000

# send probe (random IDs) and reachability test (whether existing nodes can be reached) every probeInterval
# Note that this will cause a send rate of roughly 4/probeInterval
# (expect two answers for incoming probe/reachability requests)
**.probeInterval = 0.4s # 10 messages per second send by each node
# failureFocussedProbing: if true send reachability probes to affected nodes during failures (unless isolated)
**.failureFocussedProbing = true

**.sendDataPackets = false
**.usePathIDs = false

sim-time-limit = 200s

[Config LinkFailure]
*.mainStatistics.samplingInterval = .5s
**.linkFraction = ${lfr = 0.01, 0.05, 0.1, 0.15, 0.2}
**._n = ${n = 100,200,500,1000,5000,10000,20000,50000,100000,200000}
**._m = ${m = 3}
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.txt"
routingsim.NetworkManager.dynamicsModel = "LinkFailure"
**.rediscoveryWaitTime = 400ms
**.rediscoveryUrgentWaitTime = 100ms
**.fraction = 0.025
**.linkFailure = true
**.oneFailure = true
**.linkSelection = "randomAllButOne"
**.dynamics.**.nodeFailure = 0
**.dynamics.**.warmup = 10s
**.dynamics.period = 30s
**.dynamics.duration = 100s
sim-time-limit = 210s


[Config LinkFailureOverhead]
*.mainStatistics.samplingInterval = .5s
**.bucketSize = 40
**.linkFraction = ${lfr = 0.01, 0.05, 0.1, 0.15, 0.2}
**._n = ${n = 100,200,500,1000,5000,10000,20000,50000,100000,200000}
**._m = ${m = 3}
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.txt"
*.manager.spathFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.spm.gz"
routingsim.NetworkManager.dynamicsModel = "LinkFailure"
**.fraction = 0.025
**.linkFailure = true
**.oneFailure = true
**.linkSelection = "random"
**.failureFocussedProbing = false
**.dynamics.**.nodeFailure = 0
**.dynamics.**.warmup = 10s
**.dynamics.period = 30s
**.dynamics.duration = 100s
sim-time-limit = 210s
repeat = 10


[Config LinkFailureBucket]
*.mainStatistics.samplingInterval = .5s
**._n = ${n = 10000}
**._m = ${m = 3}
**._seed = ${seed = 0}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m${m}_p0.5_seed${seed}.txt"
routingsim.NetworkManager.dynamicsModel = "LinkFailure"
**.fraction = 0.025
**.linkFailure = true
**.oneFailure = true
**.bucketSize = ${k = 20,40}
**.linkFraction = ${lfr = 0.01,0.05, 0.1..0.25 step 0.05}
**.linkSelection = "randomAllButOne"
**.dynamics.**.nodeFailure = 0
**.dynamics.**.warmup = 10s
**.dynamics.period = 10s
**.dynamics.duration = 20s
sim-time-limit = 50s
#repeat = 10
