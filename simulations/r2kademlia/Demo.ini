[General]
ned-path = ../../src;..
network = routingsim.simulations.DefaultNetwork
**.protocols = "routingsim.routing.r2kademlia.R2Kademlia"

sim-time-limit = 150s
*.mainStatistics.samplingInterval = 1s
*.dynamics.fraction = 0
*.dynamics.warmup = 0s
*.mainStatistics.recordShortestPathDeliveryRatio = false


[Config Demo]
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n100_m3_p0.5_seed0.txt"


[Config TopoAware]
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n1000_m3_p0.5_seed0.txt"
**.pathSnooping = ${snoop = true, false}
**.proximityRouting = ${pr = false, true}
**.proximityNeighborSelection = ${pns = false, true ! pr}


[Config ProbeStudy]
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n1000_m3_p0.5_seed0.txt"
**.probeStrategy = ${0, 1, 2, 3, 4}
**.detailedRoutingTableStats = true

[Config SizeStudy]
**.foo  = ${n= 100, 500, 1000, 2000, 5000, 10000, 20000}
*.manager.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m3_p0.5_seed0.txt"

[Config TopoStudy]
*.manager.topologyFile = ${"topologies/clos_fat_tree_30.txt", "topologies/powerlaw_cluster_graph_n1125_m15_p0.0_seed0.txt"}



