[General]
ned-path = ../../src;..
network = routingsim.simulations.DefaultNetwork
sim-time-limit = 150s
**.samplingInterval = 1s
**.warmup = 200s
**.protocols = "routingsim.routing.r2kademlia.R2Kademlia"
**.fraction = 0
**.topologyFile = "topologies/powerlaw_cluster_graph_n1000_m3_p0.5_seed0.txt"
**.recordShortestPathDeliveryRatio = false


[Config Demo]
**.topologyFile = "topologies/powerlaw_cluster_graph_n100_m3_p0.5_seed0.txt"


[Config MyStudy]
**.pathSnooping = ${true, false}

[Config TopoAware]
**.pathSnooping = ${snoop = true, false}
**.proximityRouting = ${pr = false, true}
**.proximityNeighborSelection = ${pns = false, true ! pr}


[Config ProbeStudy]
**.probeStrategy = ${0, 1, 2, 3, 4}
**.detailedRoutingTableStats = true

[Config Reachability]
**.probeStrategy = ${1, 3, 4}

[Config SizeStudy]
**.foo  = ${n= 100, 500, 1000, 2000, 5000, 10000, 20000}
**.topologyFile = "topologies/powerlaw_cluster_graph_n${n}_m3_p0.5_seed0.txt"
