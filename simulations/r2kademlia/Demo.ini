[General]
network = routingsim.simulations.DefaultNetwork
sim-time-limit = 150s
**.samplingInterval = 1s
**.warmup = 200s
**.protocols = "routingsim.routing.r2kademlia.R2Kademlia"
**.fraction = 0
**.topologyFile = "r2kademlia/powerlaw_cluster_graph_n1000_m3_p0.5_seed0.txt"
**.recordShortestPathDeliveryRatio = false


[Config Demo]

#**.topologyFile = "Demo/Demo-8.txt"
#**.topologyFile = "Demo/Demo-Grid-100.txt"
**.topologyFile = "r2kademlia/powerlaw_cluster_graph_n1000_m2_p0.5_seed0.txt"


[Config MyStudy]
**.pathSnooping = ${true, false}

[Config TopoAware]
**.pathSnooping = ${snoop = true, false}
**.proximityRouting = ${pr = false, true}
**.proximityNeighborSelection = ${pns = false, true ! pr}


[Config ProbeStudy]
**.probeStrategy = ${1, 2, 3}

[Config Reachability]
**.probeStrategy = ${1, 3, 4}


